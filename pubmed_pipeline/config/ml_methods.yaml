# Synonym dictionary for ML methods
# Key = canonical name, Value = list of aliases (all lowercase)

logistic_regression:      # Origins: 1970s (generalized linear models)
  - logistic regression
  - logit model
  - logit regression

random_forest:            # Created by Leo Breiman in 2001
  - random forest
  - random forests
  - rf classifier

SVM:                      # Created by Vladimir Vapnik in 1963/1995
  - svm
  - support vector machine
  - support vector machines
  - support vector classifier

neural_network:           # Origins: 1943 (McCulloch-Pitts), 1950s-80s development
  - neural network
  - neural networks
  - ann
  - artificial neural network
  - multilayer perceptron
  - mlp

deep_learning:             # Effective training of deep networks: 2006 (Hinton et al.)
  - deep learning
  - deep neural
  - cnn
  - convolutional neural network
  - rnn
  - lstm
  - gru
  - autoencoder

transformer:              # "Attention Is All You Need": 2017 (Vaswani et al.)
  - transformer
  - bert
  - gpt
  - large language model
  - llm
  - attention mechanism
  - fine-tuning
  - pretrained model

XGBoost:                  # Created by Tianqi Chen, 2014
  - xgboost
  - gradient boosting
  - gbm
  - lightgbm
  - catboost
  - gradient boosted

naive_bayes:              # Origins: 1950s-1960s
  - naive bayes
  - naïve bayes
  - bayesian classifier

decision_tree:            # Origins: 1960s (CHAID), 1980s (CART)
  - decision tree
  - decision trees
  - cart

clustering:                # k-means: 1957, hierarchical clustering: 1967
  - k-means
  - kmeans
  - hierarchical clustering
  - dbscan
  - unsupervised clustering
